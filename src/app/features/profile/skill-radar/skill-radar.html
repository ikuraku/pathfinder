<div class="flex h-full flex-col rounded-3xl bg-white p-6 shadow-sm">
  <h2 class="text-lg font-bold">Skills profile</h2>

  @if (skills().length === 0) {
    <p class="my-auto py-8 text-center text-sm text-pf-muted">
      Add skills to see your radar chart.
    </p>
  } @else {
    <svg viewBox="-45 0 290 205" class="mx-auto mt-2 w-full max-w-xs">
      @for (r of [0.25, 0.5, 0.75, 1]; track r) {
        <polygon [attr.points]="polygon(r)" fill="none" stroke="#dbe3f0" />
      }
      @for (axis of axes(); track axis.value + axis.label; let i = $index) {
        <line [attr.x1]="center" [attr.y1]="center" [attr.x2]="point(i, 1)[0]" [attr.y2]="point(i, 1)[1]"
              stroke="#dbe3f0" />
      }

      <polygon class="pf-fade" [attr.points]="polygon(1, true)" fill="#3aa743" fill-opacity="0.2"
               stroke="#3aa743" stroke-width="2" stroke-linejoin="round" />

      @for (axis of axes(); track axis.label; let i = $index) {
        <circle class="pf-fade" [attr.cx]="point(i, axis.value / 100)[0]" [attr.cy]="point(i, axis.value / 100)[1]"
                r="3.5" [attr.fill]="axis.color" stroke="white" stroke-width="1.5" />
        <text [attr.x]="label(i).x" [attr.y]="label(i).y" [attr.text-anchor]="label(i).anchor"
              font-size="10" fill="#1f2a44">{{ axis.label }}</text>
      }
    </svg>

    <ul class="mt-3 grid grid-cols-2 gap-x-4 gap-y-1.5 text-xs">
      @for (axis of axes(); track axis.label) {
        <li class="flex items-center justify-between gap-2">
          <span class="flex items-center gap-2">
            <span class="size-2.5 rounded-full" [style.background]="axis.color"></span>{{ axis.label }}
          </span>
          <span class="font-semibold">{{ axis.value }}%</span>
        </li>
      }
    </ul>
  }
</div>
