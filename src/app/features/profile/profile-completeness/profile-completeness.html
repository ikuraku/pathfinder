<div class="flex h-full flex-col rounded-3xl bg-white p-6 shadow-sm">
  <h2 class="text-lg font-bold">Profile completeness</h2>

  <div class="mt-4 flex items-center gap-5">
    <div class="relative size-28 shrink-0">
      <svg viewBox="0 0 100 100" class="size-full -rotate-90">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#e8eef8" stroke-width="9" />
        <circle class="pf-donut" cx="50" cy="50" r="45" fill="none" stroke-width="9"
                stroke-linecap="round" [attr.stroke]="color()" [attr.stroke-dasharray]="dash()" />
      </svg>
      <span class="absolute inset-0 flex items-center justify-center text-2xl font-bold">{{ percent() }}%</span>
    </div>
    <p class="text-sm text-pf-muted">{{ message() }}</p>
  </div>

  <ul class="mt-5 space-y-2.5">
    @for (item of items(); track item.label) {
      <li class="flex items-center gap-3 text-sm">
        <span class="flex size-5 shrink-0 items-center justify-center rounded-full text-[11px] font-bold"
              [class]="item.done ? 'bg-pf-green text-white' : 'border-2 border-slate-300'">
          @if (item.done) { ✓ }
        </span>
        <span class="flex-1" [class.text-pf-muted]="!item.done">{{ item.label }}</span>
        @if (!item.done && item.link) {
          <a [routerLink]="item.link" class="text-xs font-semibold text-pf-blue hover:underline">Complete →</a>
        }
      </li>
    }
  </ul>
</div>
